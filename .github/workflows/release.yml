name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the VERSION file
        run: |
          version="$(./cli version)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($version). Bump VERSION on main, then tag v$version." >&2
            exit 1
          fi
      - name: Build distributable
        run: ./cli dist
      - name: Verify archive
        run: |
          tar -tzf build/dist/CLITicker.app.tar.gz | grep -qx 'CLITicker.app/Contents/MacOS/CLITicker'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/CLITicker.app/Contents/Info.plist)" = "${GITHUB_REF_NAME#v}"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/CLITicker.app.tar.gz
          generate_release_notes: true
