name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install icon dependency
        run: python3 -m pip install --break-system-packages pillow
      - name: Build app
        run: make
      - name: Verify app bundle
        run: |
          test -x build/CLITicker.app/Contents/MacOS/CLITicker
          plutil -lint build/CLITicker.app/Contents/Info.plist
          test -f build/CLITicker.app/Contents/Resources/CLITicker.icns
          test -f build/CLITicker.app/Contents/Resources/CLIStatusTemplate.png
          python3 -m json.tool build/CLITicker.app/Contents/Resources/CLIRegistry/registry.json >/dev/null
      - name: Render panel previews
        run: make previews
      - name: Detect registry CLIs on the runner
        run: |
          build/CLITicker.app/Contents/MacOS/CLITicker --dump-registry build/previews
          cat build/previews/registry-status.json
      - name: Upload panel previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panel-previews
          path: build/previews/*
      - name: Smoke test launch
        run: |
          build/CLITicker.app/Contents/MacOS/CLITicker &
          APP_PID=$!
          sleep 10
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "App launched and stayed running for 10 seconds."
            kill "$APP_PID"
          else
            echo "App exited early." >&2
            exit 1
          fi
